<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title | default: site.title }} — CTF</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: #0a0e17; color: #e2e8f0; line-height: 1.7; }
a { color: #4db89a; text-decoration: none; }
a:hover { text-decoration: underline; }

.site-header { padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 12px; }
.site-header a { color: #94a3b8; font-size: 14px; font-weight: 500; }
.site-header a:hover { color: #e2e8f0; text-decoration: none; }
.site-header .home { color: #4db89a; font-weight: 700; font-size: 15px; }

.page-content { max-width: 760px; margin: 0 auto; padding: 40px 24px 80px; }

.page-content h1 { font-size: clamp(24px, 4vw, 36px); font-weight: 700; letter-spacing: -0.4px; color: #fff; margin-bottom: 8px; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
.page-content h2 { font-size: 22px; font-weight: 600; color: #fff; margin-top: 40px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.page-content h3 { font-size: 17px; font-weight: 600; color: #e2e8f0; margin-top: 28px; margin-bottom: 8px; }
.page-content h4 { font-size: 15px; font-weight: 600; color: #cbd5e1; margin-top: 20px; margin-bottom: 6px; }

.page-content p { color: #cbd5e1; margin-bottom: 14px; }
.page-content ul, .page-content ol { color: #cbd5e1; margin-bottom: 14px; padding-left: 24px; }
.page-content li { margin-bottom: 6px; }
.page-content li strong { color: #e2e8f0; }

.page-content blockquote { border-left: 3px solid #4db89a; padding: 12px 18px; margin: 16px 0; background: rgba(77,184,154,0.06); border-radius: 0 8px 8px 0; }
.page-content blockquote p { color: #94a3b8; font-style: italic; margin: 0; }

.page-content code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.9em; background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px; color: #e2e8f0; }
.page-content pre { background: #131720; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 16px; overflow-x: auto; margin: 16px 0; }
.page-content pre code { background: none; padding: 0; font-size: 13px; color: #b8c4d8; }

.page-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 14px; }
.page-content th { text-align: left; padding: 10px 12px; border-bottom: 2px solid rgba(255,255,255,0.12); color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.page-content td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); color: #cbd5e1; }
.page-content tr:hover td { background: rgba(255,255,255,0.02); }

.page-content hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 32px 0; }

.page-content img { max-width: 100%; border-radius: 8px; }

.footer { text-align: center; padding: 40px 24px; color: #64748b; font-size: 13px; border-top: 1px solid rgba(255,255,255,0.06); }
.footer a { color: #64748b; }
</style>
</head>
<body>

<div class="site-header">
  <a href="{{ '/' | relative_url }}" class="home">CTF</a>
  <a href="{{ '/EXPLAINER' | relative_url }}">Explainer</a>
  <a href="{{ '/document/ctf-v1.0' | relative_url }}">Spec</a>
  <a href="{{ '/tools/' | relative_url }}">Tools</a>
  <a href="https://github.com/macsimplex/coaching-trust-framework">GitHub</a>
</div>

<div class="page-content">
{{ content }}
</div>

<div class="footer">
  <p>Coaching Trust Framework — founded by Maxime Bui, 2026</p>
  <p style="margin-top:6px"><a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · <a href="https://github.com/macsimplex/coaching-trust-framework">GitHub</a> · <a href="mailto:maxime@simplex.coach">Contact</a></p>
</div>

</body>
</html>
